<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="grad-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="200" height="200" rx="100" fill="url(#grad-bg)"/>
  <!-- Decorative Glow / Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <!-- Body / Shoulders -->
