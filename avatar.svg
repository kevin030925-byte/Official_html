  <rect x="88" y="125" width="24" height="28" rx="6" fill="#FDBA74"/>
  <!-- Head -->
  <ellipse cx="100" cy="98" rx="42" ry="46" fill="url(#grad-face)"/>
  <!-- Hair Base -->
  <path d="M60 92 C58 60 76 46 100 46 C124 46 142 60 140 92 C134 94 126 84 120 84 C110 84 104 88 100 88 C96 88 90 84 80 84 C74 84 66 94 60 92 Z" fill="#1E293B"/>
  <!-- Hair Front Bangs -->
  <path d="M68 68 C76 56 100 52 112 58 C124 64 134 68 136 78 C128 72 118 70 108 72 C98 74 86 78 76 74 C72 72 70 70 68 68 Z" fill="#0F172A"/>
  <!-- Glasses -->
  <rect x="72" y="90" width="22" height="16" rx="4" fill="rgba(255,255,255,0.25)" stroke="#1E293B" stroke-width="3"/>
  <rect x="106" y="90" width="22" height="16" rx="4" fill="rgba(255,255,255,0.25)" stroke="#1E293B" stroke-width="3"/>
  <path d="M94 98 L106 98" stroke="#1E293B" stroke-width="3"/>
  <path d="M64 96 L72 96" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M128 96 L136 96" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Eyes -->
  <circle cx="83" cy="98" r="3" fill="#0F172A"/>
  <circle cx="117" cy="98" r="3" fill="#0F172A"/>
  <!-- Eyebrows -->
  <path d="M74 85 Q83 82 90 85" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M110 85 Q117 82 126 85" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M91 122 Q100 130 109 122" stroke="#EA580C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks blush -->
  <circle cx="73" cy="114" r="5" fill="#F43F5E" opacity="0.3"/>
  <circle cx="127" cy="114" r="5" fill="#F43F5E" opacity="0.3"/>
</svg>
